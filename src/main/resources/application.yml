spring:
  application:
    name: distributed-rate-limiter
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 30000
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

server:
  port: ${SERVER_PORT:8080}

ratelimiter:
  tokenBucket:
    capacity: 100
    refillRatePerMinute: 100
    ttlSeconds: 300
  leakyBucket:
    capacity: 100
    leakRatePerMinute: 100
    workerIntervalMillis: 600