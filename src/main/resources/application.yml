# Phase 2: Redis Integration Configuration
# ==========================================
#
# This configuration file is updated from Phase 1 to include Redis connection settings.
# Phase 1 used only in-memory state; Phase 2 adds Redis for distributed state.
#
# STRUCTURE:
# - spring.*: Spring Framework configuration
# - redis.*: Redis connection pooling (custom, not Spring Data)
# - server.*: Application server settings (unchanged from Phase 1)

spring:
  application:
    name: Distributed Rate Limiter

  # Spring Boot Actuator for Prometheus metrics
  # Exposes /actuator/prometheus endpoint for metrics scraping
  actuator:
    endpoints:
      web:
        exposure:
          include: prometheus,health,info

  jackson:
    serialization:
      indent-output: true
    default-property-inclusion: non_null


# Redis Configuration (Phase 2)
# =============================
# Separate from Spring Data Redis because we're using Jedis directly
# (more control over Lua script execution)
#
# Connection Pool Sizing:
# - maxPoolSize: 32 connections (handles 32 concurrent rate limit checks)
# - minIdle: 8 connections (keep warm in background)
# - maxIdle: 16 connections (trim unused connections)
# - maxWaitMillis: 10 seconds (timeout if pool exhausted)
#
# These values are conservative for a CV project.
# In production, size based on expected throughput:
#   - 100 requests/sec × 5ms per check = 500 concurrent checks
#   - Use pool size of 100-200 with minIdle=50
#
# Timeout Settings:
# - timeout: 5000ms (socket read/write timeout)
#   If Redis doesn't respond in 5 seconds, connection times out
#   Conservative for local/network Redis; production could be lower (2-3s)

redis:
  host: localhost
  port: 6379
  password:                        # Leave empty if Redis has no auth
  timeout: 5000                    # Socket timeout (ms)
  max-pool-size: 32                # Max connections in pool
  min-idle: 8                       # Min idle connections to keep open
  max-idle: 16                      # Max idle before eviction
  max-wait-millis: 10000            # Max time to wait for available connection (ms)


# Application Server
# ==================
server:
  port: 8080
  servlet:
    context-path: /


# Logging Configuration
# =====================
# Phase 2 adds more detailed Redis logging to understand operation flow
logging:
  level:
    # Application logs
    com.distributed.ratelimiter: DEBUG

    # Redis client logs
    redis.clients.jedis: WARN
    redis.clients.jedis.connection: WARN

    # Spring Boot framework
    org.springframework.boot: INFO
    org.springframework.web: INFO

  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level] %logger{0} - %msg%n"


# Management Endpoints (for monitoring)
# ======================================
management:
  server:
    port: 9090                   # Separate port for metrics
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true


# DETAILED EXPLANATION OF POOL SETTINGS
# ======================================
#
# MAX-POOL-SIZE:
# Why 32?
#   - Depends on expected concurrent rate limit checks
#   - CV project: assume ~10 concurrent users
#   - Each user might make 3 requests in parallel (page loads multiple resources)
#   - So ~30 concurrent checks
#   - Set pool size = 32 to have buffer
#
#   Formula for production:
#     max_checks_per_second × average_redis_latency
#     = (1000 requests/sec) × (5 ms Redis latency)
#     = 5 concurrent checks needed
#     Use pool size = 5 × safety_factor (e.g., 2-3)
#
# MIN-IDLE vs MAX-IDLE:
# Why maintain idle connections?
#   - Cold start: creating connection = TCP handshake + auth = ~50ms
#   - Reusing warm connection = ~5ms (10x faster)
#
# minIdle = 8:
#   - Keep 8 connections always open and ready
#   - On startup, immediately usable
#   - If load spikes, connections already warmed up
#
# maxIdle = 16:
#   - Keep max 16 idle connections
#   - If load drops, evict connections to save resources
#   - Balance: speed vs resource usage
#
# Why maxIdle > minIdle?
#   - Allows pool to grow to 16 during high load
#   - Shrinks back to 8 when load drops
#   - Prevents repeatedly creating/destroying connections
#
# MAX-WAIT-MILLIS:
# What happens if all 32 connections in use?
#   - New request waits for available connection
#   - Max wait = 10 seconds
#   - If 10 seconds passes, timeout and reject request
#
# Why 10 seconds?
#   - Conservative (CV project doesn't need speed)
#   - In production, use 2-3 seconds (SLA requirement)
#   - If timeout happens = Redis issue, should reject anyway


# SOCKET TIMEOUT EXPLANATION:
# ===========================
# timeout: 5000 (milliseconds)
#
# Scenario:
#   - Client sends Redis command: EVAL (our Lua script)
#   - Redis receives it immediately (1 ms)
#   - Lua script executes: reads bucket, calculates refill, writes result
#   - Typical execution: 1-2 ms
#
# If Redis is healthy:
#   - Response arrives in < 5000ms
#   - Connection keeps working
#
# If Redis crashes mid-script:
#   - Socket sits idle waiting for response
#   - After 5000ms, Jedis times out
#   - Throws JedisConnectionException
#   - Rate limiter rejects request (fail-closed)
#
# Why 5000 and not smaller?
#   - Network latency variance (cloud: 10-50ms)
#   - Redis under load (GC pause, slow scripts)
#   - CV project doesn't need aggressive timeouts
#
# Production values:
#   - Local Redis: 1000-2000ms
#   - Cloud Redis: 3000-5000ms
#   - Geo-distributed: 5000-10000ms
#
# Trade-off: Smaller timeout = fail faster, but risk false negatives
#            Larger timeout = fewer false negatives, but hide real issues longer


# HOW SPRING BOOT 3.3.1 READS THESE SETTINGS:
# =============================================
# application.yml is automatically discovered in:
#   - src/main/resources/
#   - External config directory (if specified)
#
# Properties under 'redis:' are bound to RedisProperties class
# via @ConfigurationProperties(prefix = "redis")
#
# Example:
#   redis.host: localhost  →  RedisProperties.host = "localhost"
#   redis.port: 6379       →  RedisProperties.port = 6379
#
# If property is missing, default value is used:
#   redis.password:  (empty) → RedisProperties.password = null
#   redis.timeout: 5000  →  RedisProperties.timeout = 5000
#
# To override at runtime:
#   java -jar app.jar --redis.port=6380 --redis.host=redis.production.local
#
# This allows same Docker image to run in dev/staging/production


# CONNECTION POOL LIFECYCLE:
# ==========================
# On Application Startup:
#   1. Spring reads application.yml
#   2. RedisConfig creates JedisPoolConfig
#   3. Creates JedisPool with minIdle=8
#   4. Opens 8 connections to Redis
#   5. Tests one connection (PING)
#   6. If all OK: startup continues
#   7. If Redis unreachable: application fails to start (fail-fast)
#
# During Request Processing:
#   1. HTTP request arrives: GET /payment/send (user1)
#   2. PaymentController calls RateLimiterService
#   3. RateLimiterService calls TokenBucketRateLimiter
#   4. RateLimiterService calls RedisClient.evalScript()
#   5. RedisClient gets connection from JedisPool
#   6. Sends EVAL command to Redis
#   7. Lua script executes on Redis
#   8. Result returned to Java
#   9. Connection returned to pool
#
# Idle Connection Eviction:
#   - EvictionTimer runs every 60 seconds
#   - Finds connections idle > 5 minutes
#   - Closes them if pool size > minIdle
#   - Total pool stays within minIdle..maxIdle range
#
# On Application Shutdown:
#   1. Spring context closes
#   2. JedisPool.destroy() called
#   3. All active connections closed
#   4. All idle connections closed
#   5. Redis connection state cleaned up


# MONITORING REDIS CONNECTIONS:
# ==============================
# After application starts, check pool status:
#   1. redis-cli COMMAND DOCS SHUTDOWN (lists all active commands)
#   2. redis-cli CLIENT LIST (shows all connected clients)
#   3. See 8 connections from your app (minIdle)
#
# During high load:
#   1. redis-cli CLIENT LIST
#   2. See more connections (up to 32)
#   3. As load drops, eviction reduces back to minIdle
#
# If pool is exhausted:
#   1. Check: redis-cli CLIENT LIST | wc -l
#   2. Count > 32? = Application is creating connections faster than returning
#   3. Likely causes:
#      - Deadlock in application code (connection never returned)
#      - Redis too slow (connections pile up waiting)
#      - Check application logs for errors